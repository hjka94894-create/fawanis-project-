<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة إدارة المشرفين - منظمة فوانيس الخير</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f9f9f9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        th { background: #0d5c3a; color: #fff; }
    </style>
</head>
<body>
    <h2>لوحة تحكم المشرفين لمراجعة الطلبات</h2>
    <table>
        <thead>
            <tr>
                <th>الرقم</th>
                <th>الاسم الكامل</th>
                <th>الرقم الوطني</th>
                <th>رقم الهاتف</th>
                <th>المشرف</th>
                <th>الحالة</th>
            </tr>
        </thead>
        <tbody>
            {% for req in requests %}
            <tr>
                <td>{{ req[0] }}</td>
                <td>{{ req[2] }}</td>
                <td>{{ req[1] }}</td>
                <td>{{ req[3] }}</td>
                <td>{{ req[4] }}</td>
                <td><b>{{ req[5] }}</b></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <div style="margin-top:30px; font-weight:bold; color:#0d5c3a; direction:ltr; text-align:center;">
        Programmer & Cybersecurity Engineer Abdeldayem Mohamed
    </div>
</body>
</html>
