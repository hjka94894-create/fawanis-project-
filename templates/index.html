        .field-group { margin-bottom: 8px; }

        .rules-box ol { margin: 0; padding-right: 15px; }

        .footer-credits { text-align: center; margin-top: 20px; font-weight: bold; color: #0d5c3a; font-size: 11px; direction: ltr; border-top: 1px dashed #b8975a; padding-top: 8px; }
        .btn-submit { background: #0d5c3a; color: #d4af37; font-weight: bold; border: 2px solid #d4af37; width: 100%; padding: 10px; font-size: 14px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .btn-submit:hover { background: #0b4a2e; }
    </style>
</head>
